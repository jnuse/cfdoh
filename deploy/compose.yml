# cfdoh compose deployment. Copy env.example to .env, adjust, then:
#   docker compose -f deploy/compose.yml up -d
services:
  cfdoh:
    image: ghcr.io/jnuse/cfdoh:latest
    container_name: cfdoh
    user: cfdoh
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      CACHE_PERSIST_PATH: /var/lib/cfdoh/cache.json
    volumes:
      - cfdoh-state:/var/lib/cfdoh
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  cfdoh-state:
