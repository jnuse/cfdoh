# Reverse-proxy sample: terminate TLS in front of cfdoh (reverse mode).
# The proxy must pass the client IP through one of the recognized headers
# (X-Real-IP, CF-Connecting-IP, or X-Forwarded-For).
server {
    listen 443 ssl http2;
    server_name doh.example.com;

    ssl_certificate     /etc/letsencrypt/live/doh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doh.example.com/privkey.pem;

    location /dns-query {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # admin / explain / health may be kept internal or exposed deliberately
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
