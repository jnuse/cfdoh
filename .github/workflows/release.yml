# Release: publish binaries, checksums and the GHCR image on vX.Y.Z tags.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: cfdoh
            goos: linux
            goarch: amd64
            ext: tar.gz
          - component: cfdoh
            goos: linux
            goarch: arm64
            ext: tar.gz
          - component: cfhost
            goos: windows
            goarch: amd64
            ext: zip
          - component: cfhost
            goos: linux
            goarch: amd64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/jnuse/cfdoh/internal/httpapi.Version=${VERSION}"
          if [ "${{ matrix.component }}" = "cfhost" ]; then
            LDFLAGS="-s -w -X main.version=${VERSION}"
          fi
          mkdir -p "dist/${{ matrix.component }}_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}"
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "dist/${{ matrix.component }}_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}/${{ matrix.component }}${{ matrix.goos == 'windows' && '.exe' || '' }}" \
            ./cmd/${{ matrix.component }}
      - name: Package
        run: |
          NAME="${{ matrix.component }}_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip -r "${NAME}.zip" "${NAME}"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
